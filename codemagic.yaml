workflows:
  ios-workflow:
    name: Tyrone XIT iOS Sin Firmar
    instance_type: mac_mini_m1
    max_build_duration: 60
    environment:
      xcode: latest
      cocoapods: default
    triggering:
      events:
        - push
    scripts:
      - name: Ver archivos
        script: |
          ls -la
          ls -la "TYRONE XIT.xcodeproj" || ls -la *.xcodeproj
      - name: Build APP sin firmar
        script: |
          xcodebuild -project "TYRONE XIT.xcodeproj" -scheme "TYRONE XIT" -sdk iphoneos -configuration Release CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" BUILD_DIR=build
      - name: Crear IPA sin firmar
        script: |
          APP_PATH=$(find build -name "*.app" | head -n 1)
          echo "App encontrada: $APP_PATH"
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -r TyroneXIT-SIN-FIRMAR.ipa Payload
          rm -rf Payload
    artifacts:
      - TyroneXIT-SIN-FIRMAR.ipa

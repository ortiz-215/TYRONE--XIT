workflows:
  ios-workflow:
    name: Tyrone XIT iOS Sin Firmar
    instance_type: mac_mini_m1
    max_build_duration: 60
    environment:
      xcode: latest
      cocoapods: default
    triggering:
      events:
        - push
    scripts:
      - name: Crear proyecto Xcode
        script: |
          brew install xcodegen || true
          cat > project.yml <<'EOF'
          name: TyroneXIT
          options:
            bundleIdPrefix: com.tyronexit
          targets:
            TyroneXIT:
              type: application
              platform: iOS
              deploymentTarget: "16.0"
              sources:
                - path: .
                  excludes:
                    - "codemagic.yaml"
              settings:
                PRODUCT_BUNDLE_IDENTIFIER: com.tyronexit.app
                INFOPLIST_FILE: Info.plist
                SWIFT_VERSION: "5.0"
          EOF
          cat > Info.plist <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleExecutable</key><string>$(EXECUTABLE_NAME)</string>
            <key>CFBundleIdentifier</key><string>$(PRODUCT_BUNDLE_IDENTIFIER)</string>
            <key>CFBundleName</key><string>$(PRODUCT_NAME)</string>
            <key>CFBundlePackageType</key><string>$(PRODUCT_BUNDLE_PACKAGE_TYPE)</string>
            <key>CFBundleShortVersionString</key><string>1.0</string>
            <key>CFBundleVersion</key><string>1</string>
            <key>LSRequiresIPhoneOS</key><true/>
            <key>UIApplicationSceneManifest</key>
            <dict>
              <key>UIApplicationSupportsMultipleScenes</key><false/>
            </dict>
            <key>UILaunchStoryboardName</key><string></string>
          </dict>
          </plist>
          EOF
          xcodegen generate
          ls -la
          ls -la *.xcodeproj
      - name: Build APP sin firmar
        script: |
          xcodebuild -project TyroneXIT.xcodeproj -scheme TyroneXIT -sdk iphoneos -configuration Release CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" BUILD_DIR=build
      - name: Crear IPA sin firmar
        script: |
          APP_PATH=$(find build -name "*.app" | head -n 1)
          echo "App: $APP_PATH"
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -r TyroneXIT-SIN-FIRMAR.ipa Payload
          rm -rf Payload
    artifacts:
      - TyroneXIT-SIN-FIRMAR.ipa

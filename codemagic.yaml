workflows:
  ios-workflow:
    name: Tyrone XIT iOS Sin Firmar
    instance_type: mac_mini_m1
    max_build_duration: 60
    environment:
      xcode: latest
      cocoapods: default
    triggering:
      events:
        - push
    scripts:
      - name: Ver archivos
        script: |
          echo "=== RAIZ ==="
          ls -la
          echo "=== BUSCAR XCODEPROJ ==="
          find . -name "*.xcodeproj" | head -n 20
          echo "=== BUSCAR XCWORKSPACE ==="
          find . -name "*.xcworkspace" | head -n 20
          echo "=== BUSCAR Package.swift ==="
          find . -name "Package.swift" | head -n 20
          echo "=== TODOS LOS ARCHIVOS ==="
          find . -type f | head -n 100
      - name: Build APP sin firmar
        script: |
          PROJECT=$(find . -name "*.xcodeproj" | head -n 1)
          echo "Proyecto: $PROJECT"
          if [ -z "$PROJECT" ]; then
            echo "NO HAY XCODEPROJ, revisa el log de Ver archivos"
            exit 1
          fi
          SCHEME=$(basename "$PROJECT" .xcodeproj)
          echo "Scheme: $SCHEME"
          xcodebuild -project "$PROJECT" -scheme "$SCHEME" -sdk iphoneos -configuration Release CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" BUILD_DIR=build
      - name: Crear IPA sin firmar
        script: |
          APP_PATH=$(find build -name "*.app" | head -n 1)
          echo "App encontrada: $APP_PATH"
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -r TyroneXIT-SIN-FIRMAR.ipa Payload
          rm -rf Payload
    artifacts:
      - TyroneXIT-SIN-FIRMAR.ipa
